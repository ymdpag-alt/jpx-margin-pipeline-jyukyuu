name: JPX 空売り残高取込

on:
  schedule:
    # JPX は毎営業日 17:00 JST 目処に掲載。JST 17:30 と 18:30 の2回試行（UTC 表記）
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "取得する公表日 (YYYY-MM-DD)。空欄なら最新"
        required: false
        default: ""
      force:
        description: "既存の日付列があっても上書きする"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "書き込まずに動作確認する"
        type: boolean
        required: false
        default: false

concurrency:
  group: karauri-zandaka
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Tokyo
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "scripts/空売り/requirements.txt"

      - name: Install dependencies
        working-directory: scripts/空売り
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: JPX空売り残高を取得してスプレッドシートに書き込み
        working-directory: scripts/空売り
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}  # 未設定でもOK(スクリプト内デフォルトを使用)
          RATIO_AS_PERCENT: "1"
          MAX_DATE_COLS: "300"
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python "jpx_short_selling.py" $ARGS
