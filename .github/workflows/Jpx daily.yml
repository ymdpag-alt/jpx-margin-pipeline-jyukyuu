name: JPX 日報 株式相場表 取得

on:
  schedule:
    # 日本時間(JST, UTC+9) 平日20:00に実行
    # GitHub Actionsのcronは UTC 基準。20:00 JST = 11:00 UTC(同一日内に収まるため曜日のずれなし)
    # cron の曜日は 0=日,1=月,...,6=土 なので、月〜金 = 1-5
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "取得したい日付 (YYYY-MM-DD)。空欄なら最新日を自動取得。"
        required: false
        default: ""
      force:
        description: "同じ日付列が既にある場合も強制的に再挿入する"
        required: false
        default: "false"
        type: boolean

jobs:
  fetch-jpx-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scripts/daily
        run: pip install -r "Requirements.txt"

      - name: JPX日報を取得してスプレッドシートに書き込み
        working-directory: scripts/daily
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}  # 未設定でもOK(スクリプト内デフォルトを使用)
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python "Fetch jpx daily.py" $ARGS
