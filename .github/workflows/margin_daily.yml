name: 信用残・貸株残の日次更新

on:
  schedule:
    - cron: "7 9 * * 1-5"        # 平日 18:07 JST（JPXの公表は16:00目安）
  workflow_dispatch:
    inputs:
      extra_dates:
        description: "掲載から外れた過去日を取得（例: 20260925,20260928）"
        required: false
        default: ""
      inspect_date:
        description: "PDFの読み取り確認だけ行う日付（例: 20261005）。指定時はシートに書かない"
        required: false
        default: ""

concurrency:
  group: margin-daily
  cancel-in-progress: false

env:
  SCRIPT: scripts/margin_balance_to_sheets.py   # スクリプトの場所（リポジトリ直下からの相対パス）

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリのインストール
        run: pip install "gspread>=6.0" "google-auth>=2.0" "pdfplumber>=0.11" "pandas>=2.0" "openpyxl>=3.1" "requests>=2.31"

      - name: PDFの読み取り確認（inspect_date 指定時のみ）
        if: ${{ github.event.inputs.inspect_date != '' }}
        run: python "$SCRIPT" --inspect "${{ github.event.inputs.inspect_date }}"

      - name: シート更新
        if: ${{ github.event.inputs.inspect_date == '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          KASHIKABU_SPREADSHEET_ID: ${{ secrets.KASHIKABU_SPREADSHEET_ID }}
          MARGIN_BACKFILL_N: "5"
          MARGIN_EXTRA_DATES: ${{ github.event.inputs.extra_dates }}
          MAX_DATE_COLS: "0"          # 0=削除しない。例: "260" で約1年分（既存の週次列も含めて数える）
          JSDA_BACKFILL_N: "2"
        run: python "$SCRIPT"
