name: JPX 空売り業種別集計 取得

on:
  schedule:
    # 毎週月〜金 21:30 JST (= 12:30 UTC) に実行
    - cron: "40 9 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "取得日付 例: 2026/08/07（空欄なら最新）"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/業種別空売り

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run JPX short-selling scraper
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python jpx_short_selling_scraper.py
