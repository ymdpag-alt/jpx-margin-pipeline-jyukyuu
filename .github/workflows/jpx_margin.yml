# .github/workflows/margin_daily.yml
name: Margin balance daily

on:
  schedule:
    # 平日 18:07 JST（JPXの公表は16:00目安。遅延に備えて余裕を持たせる）
    - cron: "7 9 * * 1-5"
  workflow_dispatch:
    inputs:
      extra_dates:
        description: "掲載から外れた過去日を取得（例: 20260925,20260928）"
        required: false
        default: ""
      inspect_date:
        description: "レイアウト確認だけしたい日付（例: 20261005）。指定時はシートに書かない"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: margin-daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "gspread>=6" pdfplumber pandas openpyxl google-auth requests

      - name: Inspect PDF layout
        if: ${{ github.event.inputs.inspect_date != '' }}
        run: python margin_balance_to_sheets.py --inspect "${{ github.event.inputs.inspect_date }}"

      - name: Update sheets
        if: ${{ github.event.inputs.inspect_date == '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          KASHIKABU_SPREADSHEET_ID: ${{ secrets.KASHIKABU_SPREADSHEET_ID }}
          MARGIN_BACKFILL_N: "5"
          MARGIN_EXTRA_DATES: ${{ github.event.inputs.extra_dates }}
          MAX_DATE_COLS: "260"   # 約1年分。0にすると削除しない
          JSDA_BACKFILL_N: "2"
        run: python margin_balance_to_sheets.py
