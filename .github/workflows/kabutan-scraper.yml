name: 株探ランキング取得

on:
  workflow_dispatch: {}   # 手動実行用（Actionsタブから「Run workflow」で即テスト可能）
  schedule:
    # cronはUTC表記です。例: 平日15:30 JST（大引け後）を狙う場合 → 06:30 UTC
    # 必要に応じて時刻・曜日を調整してください。
    - cron: '30 6 * * 1-5'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なOSパッケージをインストール（Xvfb＝仮想ディスプレイ）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-liberation libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1

      - name: Chrome をインストール
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Python 依存パッケージをインストール
        run: pip install -r scripts/かぶたん/requirements.txt

      - name: スクレイパーを実行
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          HEADLESS: "false"
          # PROXY_SERVER: ${{ secrets.PROXY_SERVER }}   # 住宅用プロキシ等を使う場合はコメントアウトを外す
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python "scripts/かぶたん/kabutan_scraper.py"
