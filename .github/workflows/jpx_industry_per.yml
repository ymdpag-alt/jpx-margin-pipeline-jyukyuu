name: JPX業種別PER（月次）

on:
  schedule:
    # 毎月1〜7日の 14:30 JST（UTC 5:30）。JPXは毎月第1営業日13時更新予定。
    # 登録済みの月は自動でスキップするので、第1営業日がずれても取りこぼさない。
    - cron: "30 5 1-7 * *"
  workflow_dispatch:
    inputs:
      force_ym:
        description: "取得する年月（例 202610。複数はカンマ区切りで 202601,202602）。空なら最新月"
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "scripts/業種PER/requirements.txt"
      - name: 依存関係のインストール
        run: pip install -r "scripts/業種PER/requirements.txt"
      - name: JPX業種別PERを取得して「業種別PER」に追記し、「業種別PER推移」を更新
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FORCE_YM: ${{ github.event.inputs.force_ym }}
        run: python "scripts/業種PER/fetch_jpx_industry_per.py"
