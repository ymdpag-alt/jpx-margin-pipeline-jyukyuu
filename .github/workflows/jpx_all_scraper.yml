name: JPX 一括スクレイプ

on:
  schedule:
    - cron: "0 7 * * 1-5"   # 平日 16:00 JST (07:00 UTC)
  workflow_dispatch:

concurrency:
  group: jpx-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: JPX データ取得 & スプシ書き込み
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: JPX スクレイプ実行
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TZ: Asia/Tokyo
        run: python scripts/JPX/scrape_jpx_all.py
