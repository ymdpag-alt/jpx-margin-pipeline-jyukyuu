name: JPX 一括スクレイプ

on:
  schedule:
    - cron: "50 7 * * 1-5"   # 平日 16:00 JST (07:00 UTC)
  workflow_dispatch:
    inputs:
      target_date:
        description: "対象日 YYYYMMDD（空欄なら最新日を自動取得）"
        required: false
        default: ""

concurrency:
  group: jpx-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: JPX データ取得 & スプシ書き込み
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install "beautifulsoup4>=4.12.0" "playwright>=1.40.0" "openpyxl>=3.1.0"

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: JPX スクレイプ実行
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TZ: Asia/Tokyo
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: python scripts/JPX/scrape_jpx_all.py
