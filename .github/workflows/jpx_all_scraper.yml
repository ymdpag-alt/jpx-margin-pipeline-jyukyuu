name: JPX 一括スクレイプ

on:
  schedule:
    - cron: "0 7 * * 1-5"   # 平日 16:00 JST (07:00 UTC)
  workflow_dispatch:

concurrency:
  group: jpx-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: JPX データ取得 & スプシ書き込み
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── デバッグ: リポジトリの実際のファイル構造を確認 ──
      - name: ファイル構造確認
        run: |
          echo "=== カレントディレクトリ ==="
          pwd
          echo ""
          echo "=== ルート直下の一覧 ==="
          ls -la
          echo ""
          echo "=== .py ファイルを全検索 ==="
          find . -name "*.py" | sort
          echo ""
          echo "=== フォルダ一覧 ==="
          find . -type d | sort

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリ インストール
        run: |
          pip install \
            "requests>=2.31.0" \
            "beautifulsoup4>=4.12.0" \
            "gspread>=6.0.0" \
            "google-auth>=2.27.0"

      - name: JPX スクレイプ実行
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TZ: Asia/Tokyo
        run: |
          SCRIPT=$(find . -name "scrape_jpx_all.py" | head -1)
          echo "スクリプトパス: $SCRIPT"
          python "$SCRIPT"
