name: JPX 一括スクレイプ

on:
  schedule:
    # cron は UTC 指定。08:07 UTC = 17:07 JST（平日）
    - cron: "7 8 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "対象日 YYYYMMDD（空欄なら各ページの最新日）"
        required: false
        default: ""

concurrency:
  group: jpx-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TARGET_DATE: ${{ github.event.inputs.target_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/JPX/requirements_jpx_all.txt

      - name: Install dependencies
        run: pip install -r scripts/JPX/requirements_jpx_all.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scripts/JPX/scrape_jpx_all.py
